name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config zlib1g-dev libffi-dev \
            libssl-dev libltdl-dev

      - name: Install buildozer (pinned 1.5.0)
        run: |
          pip install --user buildozer==1.5.0
          export PATH="$HOME/.local/bin:$PATH"

      - name: Build APK (debug)
        run: |
          cd "$GITHUB_WORKSPACE"
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee buildozer.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chainplatecost-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
